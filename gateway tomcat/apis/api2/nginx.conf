events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    server {
        listen 8081;
        server_name localhost;
        
        location / {
            add_header Content-Type application/json;
            return 200 '{"service": "product-service", "message": "API de Produtos funcionando!", "endpoint": "/", "status": "ok"}';
        }
        
        location /products {
            add_header Content-Type application/json;
            return 200 '{"service": "product-service", "message": "Lista de produtos", "products": [{"id": 1, "name": "Notebook", "price": 2500.00}, {"id": 2, "name": "Mouse", "price": 50.00}], "status": "ok"}';
        }
        
        location /products/1 {
            add_header Content-Type application/json;
            return 200 '{"service": "product-service", "message": "Produto encontrado", "product": {"id": 1, "name": "Notebook", "price": 2500.00, "description": "Notebook gamer"}, "status": "ok"}';
        }
    }
}

