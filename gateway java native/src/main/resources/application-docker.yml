# =============================================================================
# PERFIL: DOCKER
# =============================================================================
# Este perfil contém configurações específicas para ambiente Docker
# Herda todas as configurações do application.yml principal

# -----------------------------------------------------------------------------
# CONFIGURAÇÕES DE ROTAS (SERVIÇOS DOCKER)
# -----------------------------------------------------------------------------
# As rotas são configuradas dinamicamente no código Java através das classes *ApiConfig
# que detectam automaticamente o perfil Docker e ajustam as URLs dos serviços

# -----------------------------------------------------------------------------
# CONFIGURAÇÕES DE SEGURANÇA (KEYCLOAK DOCKER)
# -----------------------------------------------------------------------------
keycloak:
  enabled: false
  auth-server-url: http://keycloak:8084

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.oauth2.client.reactive.ReactiveOAuth2ClientAutoConfiguration
      - org.springframework.boot.autoconfigure.security.oauth2.resource.reactive.ReactiveOAuth2ResourceServerAutoConfiguration
  security:
    oauth2:
      client:
        registration: {}
      resourceserver:
        jwt: {}

# -----------------------------------------------------------------------------
# CONFIGURAÇÕES DE LOGGING (DOCKER)
# -----------------------------------------------------------------------------
logging:
  level:
    root: INFO
    com.example.gateway: INFO
    org.springframework.cloud.gateway: INFO
    org.springframework.security: INFO
    reactor.netty.http.client: WARN
  file:
    name: /app/logs/gateway.log
