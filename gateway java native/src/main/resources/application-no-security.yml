keycloak:
  enabled: false

# -----------------------------------------------------------------------------
# CONFIGURAÇÕES DE LOGGING (AJUSTADAS PARA DESENVOLVIMENTO)
# -----------------------------------------------------------------------------
logging:
  level:
    org.springframework.security: WARN
