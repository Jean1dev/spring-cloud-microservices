# =============================================================================
# PERFIL: NO-SECURITY
# =============================================================================
# Este perfil desabilita a segurança para desenvolvimento e testes
# Herda todas as configurações do application.yml principal

# -----------------------------------------------------------------------------
# CONFIGURAÇÕES DE SEGURANÇA (DESABILITADA)
